apiVersion: apps/v1
kind: Deployment
metadata:
  name: diffusion-demo-deployment
  labels:
    app: diffusion-demo
spec:
  replicas: 1
  minReadySeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       
      maxUnavailable: 0   
  selector:
    matchLabels:
      app: diffusion-demo
  template:
    metadata:
      labels:
        app: diffusion-demo
    spec:
      containers:
      - name: diffusion-demo
        image: akameswa/diffusion-demo-cuda-slim:use_safetensors-safety_checker
        ports:
        - containerPort: 7860
        resources:
          requests:
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1