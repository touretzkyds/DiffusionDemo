<!-- 
  Negative Prompt Demonstration Documentation
  
  This file provides the explanatory content for the Negative Prompt tab in the Diffusion Demo.
  It explains how negative prompts can be used to guide the generation process away from
  certain characteristics or features, allowing for more precise control over the output
  by explicitly specifying what should be avoided in the generated image.
-->

<details open>
    <!-- Section header with orange background -->
    <summary style="background-color: #CE6400; padding-left: 10px;">

    </summary>
    <!-- Main content container with lighter orange background and flex layout -->

        <!-- Left column for explanatory text -->
        <div style="flex: 1;">
            <!-- Explanation of negative prompts and their effects -->
            <p style="margin-top: 10px">
                Negative prompts steer images away from unwanted features. 
                For example, "red" as a negative prompt makes the generated image unlikely to have reddish hues. 
            </p>
        </div>
        
        <!-- Right column for the illustrative image -->
        <div style="flex: 1; align-content: center;">
